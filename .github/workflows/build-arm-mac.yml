name: Build ARM Mac DMG

on:
  # Allow manual trigger from Actions tab
  workflow_dispatch:

  # Auto-trigger on version tags (e.g., v1.5.3)
  push:
    tags:
      - 'v*'

jobs:
  build-arm:
    name: Build ARM64 DMG
    runs-on: macos-latest  # ARM64 runner (M1)
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build ARM Mac DMG
        run: npm run package:mac:arm
        env:
          CI: true
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Upload ARM DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfileScraper-${{ steps.package-version.outputs.version }}-arm64.dmg
          path: release/ProfileScraper-${{ steps.package-version.outputs.version }}-arm64.dmg
          retention-days: 90

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/ProfileScraper-${{ steps.package-version.outputs.version }}-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
