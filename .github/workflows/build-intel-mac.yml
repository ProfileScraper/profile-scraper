name: Build Intel Mac DMG

on:
  # Allow manual trigger from Actions tab
  workflow_dispatch:

  # Auto-trigger on version tags (e.g., v1.5.3)
  push:
    tags:
      - 'v*'

jobs:
  build-intel:
    name: Build Intel x64 DMG
    runs-on: macos-15-intel  # Intel x64 runner
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -A

          # Allow access to the key
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Extract certificate and trust it
          openssl pkcs12 -in certificate.p12 -clcerts -nokeys -out certificate.crt -passin pass:"$CERTIFICATE_PASSWORD"
          sudo security add-trusted-cert -d -r trustRoot -k build.keychain certificate.crt

          # Set keychain timeout to prevent locking
          security set-keychain-settings -lut 21600 build.keychain

          # Clean up
          rm certificate.p12 certificate.crt

      - name: Build Intel Mac DMG
        run: npm run package:mac:intel
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Upload Intel DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfileScraper-${{ steps.package-version.outputs.version }}-x64.dmg
          path: release/ProfileScraper-${{ steps.package-version.outputs.version }}-x64.dmg
          retention-days: 90

      # If triggered by a tag, attach to GitHub release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/ProfileScraper-${{ steps.package-version.outputs.version }}-x64.dmg
            release/ProfileScraper-${{ steps.package-version.outputs.version }}-x64.dmg.blockmap
            release/ProfileScraper-${{ steps.package-version.outputs.version }}-x64-mac.zip
            release/ProfileScraper-${{ steps.package-version.outputs.version }}-x64-mac.zip.blockmap
            release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
