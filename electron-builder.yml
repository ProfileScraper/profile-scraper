appId: com.profilescraper.app
productName: ProfileScraper
publish: null
directories:
  output: release
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: browsers
    to: browsers
    filter:
      - "**/*"
asarUnpack:
  - node_modules/patchright/**/*
mac:
  target: dmg
  category: public.app-category.utilities
  icon: assets/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  identity: "Joel Rhine"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
